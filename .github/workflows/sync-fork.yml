name: 自动同步Fork上游仓库
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置Git用户
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "actions@github.com"
      
      - name: 重置上游仓库
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/HKUDS/DeepTutor.git

      - name: 获取全部远程分支
        run: git fetch --all

      # 同步 main
      - name: 更新main分支
        run: |
          git checkout main
          git merge upstream/main
          git push origin main

      # 同步 dev，强制指定本地分支，消除分支名歧义
      - name: 更新dev分支
        run: |
          git checkout origin/dev -b dev || git checkout dev
          git merge upstream/dev
          git push origin dev
